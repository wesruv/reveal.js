<!DOCTYPE html>
<html>
  <head>
    <title>More Content than grid areas</title>
    <meta charset="utf-8">
    <style>
  body {
    margin: 40px;
  }
  .wrapper {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: 100px 100px;
    grid-gap: 10px;

    /* Sets the default height for unspecified rows */
    grid-auto-rows: 50px;
    background-color: #fff;
    color: #444;
  }

  .box {
    background: linear-gradient(45deg, #444, #000);
    color: #fff;
    border-radius: 1em;
    padding: 20px;
    font-size: 150%;
    text-transform: uppercase;
  }

  button {
    margin: 0 0 20px;
    padding: 0.5em 1em;
    border: 2px solid #3372a1;
    border-radius: 2em;
    font-size: 2em;
    color: #3372a1;
    background-color: transparent;
    cursor: pointer;
  }

  button:hover {
    background: #dcf0ff;
  }

   </style>
</head>

 <body>
   <div class="wrapper">
    <div class="box a">A</div>
    <div class="box b">B</div>
    <div class="box c">C</div>
    <div class="box d">D</div>
    <div class="box e">E</div>
    <div class="box f">f</div>
    <div class="box g">g</div>
    <div class="box h">h</div>
  </div>

  <script>
    const $wrapper = document.querySelector('.wrapper');
    const $body = document.querySelector('body');

    const $addElementsButton = document.createElement('button');
    $addElementsButton.innerText = 'Add an element';

    const remainingLetters = [
      'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z',
    ];
    $addElementsButton.addEventListener('click', () => {
      const nextLetter = remainingLetters.shift();
      const $box = document.createElement('div');
      $box.classList.add('box', nextLetter);
      $box.innerText = nextLetter.toUpperCase();
      $wrapper.append($box);
    });

    $body.prepend($addElementsButton);
  </script>
</body>
</html>
